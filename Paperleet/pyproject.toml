[project]
name = "paperleet"
version = "0.1.0"
description = "PaperLeet practice environment"
authors = [{ name = "Yuzhao Shi", email = "frank20050415@sjtu.edu.cn" }]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "torch>=2.11",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
